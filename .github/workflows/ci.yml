name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      - name: Code formatting
        run: cargo fmt --check
      - name: Clippy lints
        run: cargo clippy -- -D warnings
      - name: Build release binary
        run: cargo build --release
      - name: Run unit & integration tests
        run: cargo test --release
      - name: End-to-end integration demo (Unix)
        if: runner.os != 'Windows'
        run: ./target/release/shrinkgate demo
      - name: End-to-end integration demo (Windows)
        if: runner.os == 'Windows'
        run: .\target\release\shrinkgate.exe demo
