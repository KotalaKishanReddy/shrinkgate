name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      - name: Code formatting
        run: cargo fmt --check
      - name: Clippy lints
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build release binary
        run: cargo build --release --locked
      - name: Run unit & integration tests
        run: cargo test --release --locked
      - name: End-to-end integration demo (Unix)
        if: runner.os != 'Windows'
        run: ./target/release/shrinkgate demo
      - name: End-to-end integration demo (Windows)
        if: runner.os == 'Windows'
        run: .\target\release\shrinkgate.exe demo

      - name: Local fixture benchmark (Unix)
        if: runner.os != 'Windows'
        run: ./target/release/shrinkgate benchmark --iterations 10
      - name: Local fixture benchmark (Windows)
        if: runner.os == 'Windows'
        run: .\target\release\shrinkgate.exe benchmark --iterations 10
      - name: Unix installer syntax
        if: runner.os != 'Windows'
        run: sh -n scripts/install.sh
      - name: PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd/scripts/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: '1.85.0'
      - run: cargo check --all-targets --locked
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
      - run: cargo install cargo-audit --locked
      - run: cargo audit
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: docker build -t shrinkgate-ci .
      - run: docker run --rm shrinkgate-ci --version
