name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write

jobs:
  build-binaries:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive_name: x86_64-linux
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_name: aarch64-macos
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_name: x86_64-macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_name: x86_64-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package release tarball (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/shrinkgate README.md LICENSE dist/
          tar -czf "shrinkgate-${GITHUB_REF_NAME}-${{ matrix.archive_name }}.tar.gz" -C dist .
      - name: Package release assets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/${{ matrix.target }}/release/shrinkgate.exe, README.md, LICENSE -Destination dist
          tar -czf "shrinkgate-${env:GITHUB_REF_NAME}-${{ matrix.archive_name }}.tar.gz" -C dist .
          Compress-Archive -Path dist/* -DestinationPath "shrinkgate-${env:GITHUB_REF_NAME}-${{ matrix.archive_name }}.zip"
      - name: Upload asset artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: binary-${{ matrix.archive_name }}
          path: |
            shrinkgate-*.tar.gz
            shrinkgate-*.zip

  publish-release:
    name: publish-github-release
    needs: [build-binaries]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all binary artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4
        with:
          pattern: binary-*
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "ShrinkGate ${GITHUB_REF_NAME}" \
            --generate-notes \
            shrinkgate-*.tar.gz \
            shrinkgate-*.zip

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compute image name (ghcr.io requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Log in to ghcr.io
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build image
        run: |
          V="${GITHUB_REF_NAME#v}"
          docker build -t "$IMAGE:latest" -t "$IMAGE:$V" .
      - name: Push image
        run: |
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_REF_NAME#v}"
