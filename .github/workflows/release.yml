name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  binary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - run: cargo build --release
      - name: Package release tarball
        run: |
          mkdir -p dist
          cp target/release/shrinkgate README.md LICENSE dist/
          tar -czf "shrinkgate-${GITHUB_REF_NAME}-x86_64-linux.tar.gz" -C dist .
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "ShrinkGate ${GITHUB_REF_NAME}" \
            --generate-notes \
            "shrinkgate-${GITHUB_REF_NAME}-x86_64-linux.tar.gz"

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Compute image name (ghcr.io requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Log in to ghcr.io
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build image
        run: |
          V="${GITHUB_REF_NAME#v}"
          docker build -t "$IMAGE:latest" -t "$IMAGE:$V" .
      - name: Push image
        run: |
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_REF_NAME#v}"
