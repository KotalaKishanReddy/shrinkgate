 <linearGradient id="background" x2="1" y2="1"><stop stop-color="#101c2a"/><stop offset="1" stop-color="#09111c"/></linearGradient>
 <linearGradient id="accent"><stop stop-color="#93e5c2"/><stop offset="1" stop-color="#75bcff"/></linearGradient>
</defs>
<rect width="1200" height="360" rx="20" fill="url(#background)"/>
<path d="M660 0v360M0 310h1200" stroke="#243346" opacity=".6"/>
<text x="50" y="53" fill="#93e5c2" font-family="ui-monospace,monospace" font-size="13" letter-spacing="2">LOCAL · OPEN SOURCE · RUST</text>
<text x="48" y="131" fill="#f0f5fc" font-family="system-ui,sans-serif" font-size="48" font-weight="750" letter-spacing="-1.7">Less repetition.</text>
<text x="48" y="193" fill="#f0f5fc" font-family="system-ui,sans-serif" font-size="48" font-weight="750" letter-spacing="-1.7">More room to build.</text>
<text x="50" y="243" fill="#a9bed3" font-family="system-ui,sans-serif" font-size="19">Tool-output deduplication for coding agents.</text>
